<html>
<head>


    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Escaping the Prison</title>
    <link href="https://cdn.jsdelivr.net/gh/NoseyGames/data@main/favicon.png" rel="shortcut icon" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }
    </style>
</head>
<body>
<script src="/js/main.js"></script>
<div height="100%" id="ruffle" width="100%"></div>
<script>
    function loadLocalRuffle() {
        var script = document.createElement('script');
        script.src = '/3kh0s.github.io/3kh0s.github.io/storage/js/ruffle.js';
        document.body.appendChild(script);
    }

    var cdnScript = document.createElement('script');
    cdnScript.src = '/unpkg.com/@ruffle-rs/ruffle';
    cdnScript.onerror = loadLocalRuffle;
    document.body.appendChild(cdnScript);
</script>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("escapingtheprison.swf");
    });
</script>
</body>
</html>
