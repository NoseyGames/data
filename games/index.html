<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Italian Brainrot Obby Parkour | Nikehub</title>
  <style>
    html, body { 
        background: #000; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        padding: 0; 
        margin: 0; 
    }
    #gameContainer { position: absolute; width: 100%; height: 100%; }
    #gameContainer canvas { width: 100%; height: 100%; display: block; }
    
    /* Main Unity Percentage Loader */
    #loadingBar {
        color: white; 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        font-family: Arial, sans-serif; 
        text-align: center;
        z-index: 5;
    }

    /* File Merger UI Box */
    #file-merger-loading {
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        background: rgba(0, 0, 0, 0.95); 
        color: white; 
        padding: 30px 40px; 
        border-radius: 10px; 
        font-family: monospace; 
        font-size: 16px; 
        z-index: 10000; 
        min-width: 320px; 
        text-align: center;
        transition: opacity 0.8s ease; /* Fade effect */
        pointer-events: none;
    }
    
    .nike-link {
        font-size: 15px; 
        color: #d42222; 
        text-decoration: underline; 
        margin-bottom: 10px; 
        display: block;
        pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="gameContainer" style="display:none;">
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loadingBar">
    loading... <span id="pct">0%</span>
  </div>

  <script>
    /* 1. CONFIGURATION - Fixed pathing with trailing slash */
    window.fileMergerConfig = {
      files: [
        { name: 'TPG_ItalianBrainrotObbyParkour_V01i.data.unityweb', parts: 2 },
      ],
      basePath: 'Build/', 
      debug: true
    };
  </script>

  <script>
    /* 2. NIKEHUB FILE MERGER ENGINE */
    (function () {
      "use strict";
      const config = Object.assign({ files: [], basePath: "", debug: true }, window.fileMergerConfig || {});
      window.mergedFiles = window.mergedFiles || {};
      const mergeStatus = {};
      const mergeProgress = {};
      let loadingDiv, loadingContent;

      function initializeUI() {
        loadingDiv = document.createElement("div");
        loadingDiv.id = "file-merger-loading";
        loadingContent = document.createElement("div");
        loadingDiv.appendChild(loadingContent);
        document.body.appendChild(loadingDiv);
      }

      function updateLoadingDisplay() {
        if (!loadingContent) return;
        const lines = [
          '<div style="font-size: 18px; margin-bottom: 15px;">loading...</div>',
          '<a href="https://nikehub.org" class="nike-link">nikehub</a>'
        ];
        
        config.files.forEach((file) => {
          const status = mergeStatus[file.name] || "waiting";
          const prog = mergeProgress[file.name] || { current: 0, total: file.parts };
          let color = "#888";
          let statusText = status;
          
          if (status === "merging") {
              color = "#ffa500";
              statusText = `merging... ${prog.current}/${prog.total}`;
          } else if (status === "ready") {
              color = "#00ff00";
              statusText = "done";
          }
          
          lines.push(`<div style="margin: 8px 0; color: ${color};">${file.name}: ${statusText}</div>`);
        });
        
        loadingContent.innerHTML = lines.join("");

        // If all files are done, wait 2 seconds then fade out
        if (config.files.every(f => mergeStatus[f.name] === "ready")) {
          setTimeout(() => {
            loadingDiv.style.opacity = "0";
            setTimeout(() => loadingDiv.remove(), 800);
          }, 2000);
        }
      }

      // Intercept Fetch Requests
      if (!window.originalFetch) window.originalFetch = window.fetch;
      window.fetch = function (url, ...args) {
        const urlStr = url.toString();
        const found = config.files.find(f => urlStr.includes(f.name));
        if (found && !urlStr.includes(".part")) {
          return new Promise((resolve) => {
            const check = setInterval(() => {
              if (window.mergedFiles[found.name]) {
                clearInterval(check);
                resolve(new Response(window.mergedFiles[found.name], { 
                    headers: { "Content-Type": "application/octet-stream" } 
                }));
              }
            }, 100);
          });
        }
        return window.originalFetch.apply(this, [url, ...args]);
      };

      async function startMerge() {
        initializeUI();
        for (const file of config.files) {
          const fullPath = config.basePath + file.name;
          mergeStatus[file.name] = "merging";
          updateLoadingDisplay();
          const buffers = [];
          try {
            for (let i = 1; i <= file.parts; i++) {
              const res = await window.originalFetch(`${fullPath}.part${i}`);
              if (!res.ok) throw new Error("Part missing");
              buffers.push(await res.arrayBuffer());
              mergeProgress[file.name] = { current: i, total: file.parts };
              updateLoadingDisplay();
            }
            const totalSize = buffers.reduce((a, b) => a + b.byteLength, 0);
            const merged = new Uint8Array(totalSize);
            let offset = 0;
            for (const b of buffers) { 
                merged.set(new Uint8Array(b), offset); 
                offset += b.byteLength; 
            }
            window.mergedFiles[file.name] = merged.buffer;
            mergeStatus[file.name] = "ready";
            updateLoadingDisplay();
          } catch (e) { 
            mergeStatus[file.name] = "failed"; 
            updateLoadingDisplay(); 
            console.error("Merge failed:", e);
          }
        }
      }
      startMerge();
    })();
  </script>

  <script>
    /* 3. UNITY ENGINE LOADER */
    var canvas = document.querySelector("#unity-canvas");
    var container = document.querySelector("#gameContainer");
    var loadingBar = document.getElementById("loadingBar");
    var pctText = document.getElementById("pct");

    // Must match folder name exactly
    var buildUrl = "Build/"; 

    var config = {
      dataUrl:      buildUrl + "TPG_ItalianBrainrotObbyParkour_V01i.data.unityweb",
      frameworkUrl: buildUrl + "TPG_ItalianBrainrotObbyParkour_V01i.framework.js.unityweb",
      codeUrl:      buildUrl + "TPG_ItalianBrainrotObbyParkour_V01i.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Cursora Labs O.Ü",
      productName: "Italian Brainrot Obby Parkour",
      productVersion: "0.1i",
    };

    var script = document.createElement("script");
    script.src = buildUrl + "TPG_ItalianBrainrotObbyParkour_V01i.loader.js";
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        pctText.innerText = Math.round(progress * 100) + "%";
      }).then((instance) => {
        // Hide Unity loader text and show game
        loadingBar.style.display = "none";
        container.style.display = "block";
        window.focus();
      }).catch(err => {
          console.error(err);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
