<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Italian Brainrot Obby Parkour</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <div id="loading-cover">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="logo.png"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Updated to target the actual file in your /Build folder
        const buildUrl = "Build/"; 
        const loaderUrl = buildUrl + "/TPG_ItalianBrainrotObbyParkour_V01i.loader.js";
        
        const config = {
            dataUrl: buildUrl + "/TPG_ItalianBrainrotObbyParkour_V01i.data.unityweb",
            frameworkUrl: buildUrl + "/TPG_ItalianBrainrotObbyParkour_V01i.framework.js.unityweb",
            codeUrl: buildUrl + "/TPG_ItalianBrainrotObbyParkour_V01i.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Cursora Labs O.Ü",
            productName: "Italian Brainrot Obby Parkour",
            productVersion: "0.1i",
        };

        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            // Start loading Unity
            const unityPromise = createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = (100 * progress) + "%";
            });

            // Create a 2-second minimum timer
            const timerPromise = new Promise(resolve => setTimeout(resolve, 2000));

            // Only proceed once BOTH the game is ready and 2 seconds have passed
            Promise.all([unityPromise, timerPromise]).then(() => {
                loadingCover.style.opacity = "0";
                setTimeout(() => {
                    loadingCover.style.display = "none";
                }, 800);
            }).catch((message) => {
                console.error("Unity failed to load:", message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
